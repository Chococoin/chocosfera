[package]
name = "chocosfera_tcg"
version = "0.1.0"
edition = "2021"
description = "Simulador de juego de cartas TCG para Chocosfera"
authors = ["Chocosfera Team"]

[dependencies]
crossterm = "0.28"
rand = "0.8"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
csv = "1.3"
clap = { version = "4.4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
